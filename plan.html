  <main id="main">
    <div class="wrap" id="plan">
      <div class="page-intro">
        <noscript><p class="banner">需要启用 JavaScript 才能加载阅读计划。</p></noscript>
        <p id="status" class="banner" hidden></p>
        <p class="kicker" id="plan-updated">12 周</p>
        <h1>阅读计划</h1>
        <p class="muted">四个阶段接在一条 12 周的时间轴上。勾选存在这台浏览器的 localStorage，不会上传。周次只表示阶段长度，JSON 里没有把论文分到具体某一周。</p>
      </div>
      <section class="section" aria-labelledby="timeline-title">
        <div class="section-head">
          <h2 id="timeline-title">时间轴</h2>
          <button type="button" class="btn btn-line" id="reset-progress">清除本机进度</button>
        </div>
        <p id="total-progress-label" class="muted">正在统计</p>
        <div class="progress" aria-hidden="true"><i id="total-progress"></i></div>
        <div id="timeline" class="weeks"></div>
      </section>
      <div id="stages"></div>
      <section class="section" aria-labelledby="idea-title">
        <div class="section-head">
          <div>
            <p class="kicker">初步想法</p>
            <h2 id="idea-title">研究设想</h2>
          </div>
        </div>
        <div id="ideas" class="ideas"></div>
      </section>
      <section class="section" aria-labelledby="tool-title">
        <div class="section-head">
          <div>
            <p class="kicker">仓库均在计划数据里</p>
            <h2 id="tool-title">工具链</h2>
          </div>
        </div>
        <div id="tools" class="tools"></div>
      </section>
    </div>
